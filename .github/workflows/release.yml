name: Release Apple silicon DMG

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build and verify DMG
        run: |
          command -v just >/dev/null || brew install just
          just dmg
          hdiutil verify target/doohickey-arm64.dmg

      - name: Publish DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          asset=target/doohickey-arm64.dmg
          if ! draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            gh release create "$tag" --draft --verify-tag --generate-notes
          elif [[ "$draft" == false ]]; then
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "${asset##*/}"
            exit 0
          fi
          gh release upload "$tag" "$asset" --clobber
          gh release edit "$tag" --draft=false
