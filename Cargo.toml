[package]
name = "doohickey"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small, native macOS menu bar checklist"
include = ["/src/**", "/macos/**", "/.cargo/config.toml", "/justfile", "/README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "NSAccessibilityProtocols", "NSAlert", "NSApplication",
    "NSAttributedString", "NSButton", "NSCell", "NSColor", "NSControl", "NSEvent",
    "NSFont", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSParagraphStyle",
    "NSPasteboard", "NSPopover", "NSResponder", "NSRunningApplication", "NSScrollView", "NSStatusBar",
    "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSText", "NSTextField",
    "NSTextInputClient", "NSTextView", "NSUserInterfaceLayout", "NSView",
    "NSViewController", "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSNotification", "NSString", "NSValue"] }
